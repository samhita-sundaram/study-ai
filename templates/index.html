<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AI Study Tool</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <h1>AI Study Tool</h1>
        <p>Paste your study notes below and get a question to test your understanding.</p>
        <textarea id="notes" placeholder="Paste your notes here..."></textarea>
        <button onclick="generateQuestion()">Generate Question</button>
        <p id="loading">Generating question...</p>
        <div id="result">
            <h3>Your Study Question</h3>
            <p id="question"></p>
            <textarea id="answer" placeholder="Answer.."></textarea>
            <button onclick="giveFeedback()">Give Feedback</button>
            <p id="loadingFeedback">Evaluating your question...</p>
            <p id="feedback"></p>
        </div>
        <div id="summary">
            <p id="summaryContent"></p>
            <button onclick="showSummary()">Show Summary</button>
        </div>
    <script src="/static/script.js"></script>
    </body>
</html>
